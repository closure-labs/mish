name: Mish Nix cache
description: Install Nix with signed public substitutes and optionally upload trusted builds
inputs:
  public-key:
    description: Public signing key from CACHIX_PUBKEY
    default: mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=
  token:
    description: CACHIX_TOKEN; supply only for trusted main or release jobs
    default: ''
  restore-store:
    description: Restore the supplementary GitHub store snapshot
    default: 'true'
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: |
          extra-substituters = https://mish.cachix.org
          extra-trusted-public-keys = ${{ inputs.public-key }}
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
      if: inputs.restore-store == 'true'
      with:
        primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'apps/mish/Cargo.lock') }}-${{ github.sha }}-${{ github.workflow }}
        restore-prefixes-first-match: |
          nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'apps/mish/Cargo.lock') }}-
          nix-v2-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size: 5G
    - name: Locate pinned Cachix CLI
      id: cachix
      shell: bash
      run: nix develop --accept-flake-config --command bash -c 'printf "path=%s\n" "$(command -v cachix)"' >> "$GITHUB_OUTPUT"
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17, Node 24
      with:
        name: mish
        authToken: ${{ inputs.token }}
        skipPush: ${{ inputs.token == '' }}
        skipAddingSubstituter: true
        cachixBin: ${{ steps.cachix.outputs.path }}
