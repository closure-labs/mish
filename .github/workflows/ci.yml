name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@56a7bb7b56d9a92d4fd1bc05758de7eea4a370a8
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Evaluate all supported systems and checks
        id: evaluation
        shell: bash
        run: nix flake check --all-systems --no-build --accept-flake-config 2>&1 | tee evaluation.log
      - name: Native package and checks (x86 includes VM application test)
        id: native
        shell: bash
        run: nix flake check -L --accept-flake-config 2>&1 | tee native-checks.log
      - name: Record validation scope
        if: always()
        env:
          SYSTEM: ${{ matrix.system }}
          SOURCE_REVISION: ${{ github.sha }}
          EVALUATION_RESULT: ${{ steps.evaluation.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
        run: |
          {
            printf 'Source: %s\n\nArchitecture: %s\n\n' "$SOURCE_REVISION" "$SYSTEM"
            printf '| Validation | Result |\n|---|---|\n'
            printf '| All-system evaluation | %s |\n| Native package and checks | %s |\n' "$EVALUATION_RESULT" "$NATIVE_RESULT"
            if [ "$SYSTEM" = x86_64-linux ]; then
              printf '\nNative checks include the booted appliance VM and snapshot recovery scenario.\n'
            fi
            printf '\nImage realization and physical hardware acceptance are separate gates.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-${{ matrix.system }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evaluation.log
            native-checks.log
          if-no-files-found: ignore
          retention-days: 14
