name: Images
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            targets: vestaforge-mini-pc-image vestaforge-mini-pc-installer
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            targets: vestaforge-rpi4-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: cachix/install-nix-action@56a7bb7b56d9a92d4fd1bc05758de7eea4a370a8
      - uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Build committed inputs and archive complete closures
        env:
          SYSTEM: ${{ matrix.system }}
          TARGETS: ${{ matrix.targets }}
        run: nix develop --accept-flake-config --command bash .github/scripts/build-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: images-${{ matrix.system }}
          path: artifacts/
          retention-days: 14
