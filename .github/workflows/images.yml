name: Images
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            targets: mish-mini-pc-image mish-mini-pc-installer
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            targets: mish-rpi4-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Build committed inputs and archive complete closures
        env:
          SYSTEM: ${{ matrix.system }}
          TARGETS: ${{ matrix.targets }}
        run: nix develop --accept-flake-config --command bash .github/scripts/build-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: images-${{ matrix.system }}
          path: artifacts/
          retention-days: 14
