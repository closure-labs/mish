name: Maintenance
on:
  schedule:
    - cron: '13 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
      - run: nix flake update --accept-flake-config
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: updated-lock
          path: flake.lock
  checks:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: updated-lock
          path: .
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
          token: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.CACHIX_TOKEN || '' }}
      - run: nix flake check --all-systems --no-build --accept-flake-config
      - run: nix flake check --accept-flake-config
      - name: Cache validated maintenance outputs
        env:
          MISH_CACHE_UPLOAD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: nix develop --accept-flake-config --command bash .github/scripts/cache-outputs.sh
  pull-request:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: updated-lock
          path: .
      - name: Open reviewed update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: maintenance/flake-inputs
          draft: true
          commit-message: 'chore: update pinned flake inputs'
          title: 'chore: update pinned flake inputs'
          body: 'Both native x86 and ARM checks, plus all-system evaluation, ran explicitly against this lockfile before opening this draft. Review the input changes, then mark ready to trigger required PR Checks and queue admission. GITHUB_TOKEN-created PR checks may require workflow approval. Physical qualification remains required.'
