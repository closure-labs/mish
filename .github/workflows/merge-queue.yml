name: Merge queue
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-queue-main
  cancel-in-progress: false
jobs:
  enqueue:
    if: >-
      vars.MISH_QUEUE_APP_AUTOMATION == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted queue automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
      - name: Validate GitHub App configuration
        env:
          MISH_QUEUE_APP_ID: ${{ vars.MISH_QUEUE_APP_ID }}
          MISH_QUEUE_APP_PRIVATE_KEY: ${{ secrets.MISH_QUEUE_APP_PRIVATE_KEY }}
        run: nix develop --accept-flake-config --command python .github/scripts/queue_prs.py --check-configuration
      - name: Create repository-scoped queue token
        id: queue-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.MISH_QUEUE_APP_ID }}
          private-key: ${{ secrets.MISH_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-merge-queues: write
      - name: Queue current validated PR heads
        env:
          GH_TOKEN: ${{ steps.queue-token.outputs.token }}
          MISH_QUEUE_AUTH: github-app
        run: nix develop --accept-flake-config --command python .github/scripts/queue_prs.py
