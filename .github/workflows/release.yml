name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
      - name: Validate gate policy and record qualification dependencies
        run: nix develop --accept-flake-config --command python .github/scripts/qualification.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-${{ github.workflow }}-${{ github.sha }}
          path: artifacts/qualification*
          if-no-files-found: error
          retention-days: 14
  images:
    needs: qualify
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            targets: mish-mini-pc-image mish-mini-pc-installer
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            targets: mish-rpi4-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Require successful qualification policy
        env:
          QUALIFIER_RESULT: ${{ needs.qualify.result }}
        run: test "$QUALIFIER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
          token: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.CACHIX_TOKEN || '' }}
      - run: nix flake check --all-systems --no-build --accept-flake-config
      - run: nix flake check --accept-flake-config
      - name: Build committed inputs and archive complete closures
        env:
          SYSTEM: ${{ matrix.system }}
          TARGETS: ${{ matrix.targets }}
        run: nix develop --accept-flake-config --command bash .github/scripts/build-images.sh
      - name: Cache image closures, developer shell, and validation evidence
        env:
          SYSTEM: ${{ matrix.system }}
          MISH_CACHE_UPLOAD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: nix develop --accept-flake-config --command bash .github/scripts/cache-outputs.sh
      - name: Verify complete artifact checksums
        run: nix develop --accept-flake-config --command bash -c 'cd artifacts && sha256sum --check SHA256SUMS'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: images-${{ matrix.system }}
          path: artifacts/
          retention-days: 14
  draft:
    needs: [qualify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/nix
        with:
          public-key: ${{ vars.CACHIX_PUBKEY || 'mish.cachix.org-1:TVqZ5PamlcnYEpNEJtBz7xNmS7H5X/gXQXYVeDBD4FY=' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: images-*
          path: artifacts
      - name: Verify downloaded image integrity and source identity
        run: nix develop --accept-flake-config --command python .github/scripts/qualification.py --artifact-root artifacts
      - name: Create draft pending physical acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --accept-flake-config --command bash .github/scripts/draft-release.sh
