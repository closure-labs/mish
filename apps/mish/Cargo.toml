[package]
name = "mish"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Offline event coordination with community and private Meshtastic channels"
repository = "https://github.com/closure-labs/mish"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.13"
prost = "=0.14.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-serial = { version = "=5.5.0", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "mish"
path = "src/main.rs"
