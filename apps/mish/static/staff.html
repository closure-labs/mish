<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mish staff</title>
<style>body{font:18px system-ui;max-width:48em;margin:2em auto;padding:1em}input,textarea,button,select{font:inherit;margin:.3em;padding:.4em}article{border-bottom:1px solid #ccc;padding:1em;white-space:pre-wrap}</style>
<h1>Mish staff</h1><p>Private event coordination. Submission and transport confirmation do not mean staff read a message.</p>
<label>Enrollment token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><button id="logout">Clear token</button>
<form id="send"><label>Text <textarea id="text" required maxlength="160"></textarea></label><label>Type <select id="kind"><option>message</option><option>alert</option><option>urgent</option></select></label><label>Accountable responder <input id="responder"></label><button>Send</button></form>
<form id="publish"><label>Official public announcement <textarea id="announcement" required></textarea></label><button>Publish (operator)</button></form>
<p id="status" role="status"></p><p id="radio" role="status"></p><main id="messages"></main>
<script>
let credential='', generation=0; const el=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+credential,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function refresh(){if(!credential)return;const current=generation;try{const v=await api('/api/messages');const operational=await api('/api/status');if(current!==generation)return;el('radio').textContent='Radio: '+operational.radio+' ('+operational.adapter+')';el('messages').replaceChildren();for(const m of v.messages){const a=document.createElement('article');a.textContent=`${m.kind.toUpperCase()} ${m.id}\n${m.text}\nFrom: ${m.author_name||m.author}\n${m.state}${m.expired?' • expired':''}\nDurably stored • Queue: ${m.delivery.queue}\nRadio submitted: ${m.delivery.radioSubmittedAt?'yes':'unconfirmed'} • Transport confirmed: ${m.delivery.transportConfirmedAt?'yes':'no'} • Send uncertainty: ${m.delivery.uncertainAt?'yes':'no'}\nResponder: ${m.responder||'—'}\n`+m.acknowledgements.map(x=>`${x.source==='radio'?'radio-reported':x.source} ACK: ${x.actor} ${x.node||''}`).join('\n');if(m.kind!=='message'&&!m.expired){const b=document.createElement('button');b.textContent='Acknowledge '+m.id;b.onclick=()=>api('/api/alerts/'+m.id+'/ack',{}).then(refresh).catch(error);a.append(b);}el('messages').append(a);}}catch(e){error(e);}}
function error(e){el('status').textContent=e.message;}
el('connect').onclick=()=>{generation++;credential=el('token').value;el('token').value='';refresh();};el('logout').onclick=()=>{generation++;credential='';el('messages').replaceChildren();el('radio').textContent='';el('token').value='';};
el('send').onsubmit=async e=>{e.preventDefault();try{const kind=el('kind').value;const text=el('text').value;const payload=kind==='message'?{text}:{text,kind,responder:el('responder').value,expires:Date.now()/1000+3600};await api(kind==='message'?'/api/messages':'/api/alerts',payload);el('text').value='';el('status').textContent='Durably accepted';refresh();}catch(e){error(e);}};
el('publish').onsubmit=async e=>{e.preventDefault();try{await api('/api/announcements',{text:el('announcement').value});el('announcement').value='';el('status').textContent='Published';}catch(e){error(e);}};setInterval(refresh,3000);
</script></html>
